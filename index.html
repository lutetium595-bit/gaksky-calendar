<script>const birthdayDday=document.getElementById('birthdayDday');function updateBirthdayDday(){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());let birthday=new Date(now.getFullYear(),1,4);if(today>birthday)birthday=new Date(now.getFullYear()+1,1,4);const days=Math.round((birthday-today)/86400000);birthdayDday.textContent=days===0?'D-DAY 🎂':`D-${days}`;}const firstBroadcastDays=document.getElementById('firstBroadcastDays');function updateFirstBroadcastDays(){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const firstDay=new Date(2022,9,10);const days=Math.floor((today-firstDay)/86400000);firstBroadcastDays.textContent=days<0?'0일째':`${days}일째`;}updateBirthdayDday();updateFirstBroadcastDays();setInterval(()=>{updateBirthdayDday();updateFirstBroadcastDays();},60*60*1000);const themeToggle=document.getElementById('themeToggle');function setTheme(theme){const dark=theme==='dark';document.body.classList.toggle('dark',dark);themeToggle.textContent=dark?'☀️':'🌙';themeToggle.setAttribute('aria-label',dark?'라이트모드로 전환':'다크모드로 전환');themeToggle.title=dark?'라이트모드 전환':'다크모드 전환';localStorage.setItem('gaksky-theme',theme);}const savedTheme=localStorage.getItem('gaksky-theme');if(savedTheme){setTheme(savedTheme);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){setTheme('dark');}themeToggle.addEventListener('click',()=>setTheme(document.body.classList.contains('dark')?'light':'dark'));</script>
